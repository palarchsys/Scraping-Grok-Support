# 8 groupes fermés — partition de tout le crime « faits divers ».
# Un article criminel a exactement un type_crime. Hors crime : is_crime=false, type_crime=null.
type_crime:
  - atteintes_vie
  - violences_personnes
  - atteintes_sexuelles
  - atteintes_biens
  - stupefiants
  - criminalite_economique
  - circulation_securite
  - ordre_public_surete

type_crime_labels:
  atteintes_vie: Atteintes volontaires à la vie
  violences_personnes: Violences aux personnes
  atteintes_sexuelles: Atteintes sexuelles
  atteintes_biens: Atteintes aux biens
  stupefiants: Stupéfiants
  criminalite_economique: Criminalité économique et numérique
  circulation_securite: Circulation et accidents
  ordre_public_surete: Ordre public et sûreté

# Un fort → LLM. Deux faibles (ou un faible dans le titre) → LLM.
prefilter_strong:
  - meurtre
  - assassinat
  - homicide
  - coup de couteau
  - poignardé
  - poignardée
  - tabassé
  - tabassée
  - viol
  - rixe
  - braquage
  - vol avec violence
  - cambriolage
  - cambriolé
  - coups et blessures
  - ITT
  - séquestration
  - enlèvement
  - otage
  - interpellé
  - interpellée
  - mis en examen
  - stupéfiants
  - cocaïne
  - cannabis
  - escroquerie
  - blanchiment
  - délit de fuite
  - attentat
  - terroriste
  - proxénétisme

prefilter_weak:
  - agression
  - agressé
  - agressée
  - violenté
  - violentée
  - violences
  - violence
  - menacé
  - menacée
  - incendie
  - extorsion
  - recel
  - arnaque
  - fraude
  - harcèlement
  - corruption
  - trafic

confidence_threshold: 0.7
max_article_chars: 1800
