[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sscraping"
version = "1.1.0"
description = "Bot pédagogique scrape Scrapy + analyse d'articles (Grok API / V100 local)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "palarchsys" }]
dependencies = [
  "httpx[http2]>=0.27",
  "selectolax>=0.3.27",
  "lxml>=5.3",
  "scrapy>=2.11",
  "parsel>=1.9",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "tenacity>=9.0",
  "orjson>=3.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
sscraping = "sscraping.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sscraping = ["db/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
